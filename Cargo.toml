[package]
name = "symbolasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "symbolasm"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
roxml = "0.2.0"

[workspace]
members = ["m33"]
# demo-rs is built for the target, on its own
exclude = ["m33/demo-rs"]
